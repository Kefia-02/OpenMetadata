name: Isolated pagination PR regression checks
on:
  push:
    branches:
      - verify/openmetadata-ui-tests-20261121
permissions:
  contents: read
jobs:
  pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 38308
            sha: 5ff7b76fd17fe9676365fba160d991e2403a8e52
            sources: >-
              src/components/Classifications/ClassificationDetails/ClassificationDetails.tsx
              src/components/Settings/Bot/BotListV1/BotListV1.component.tsx
              src/pages/NotificationListPage/NotificationListPage.tsx
              src/pages/PoliciesPage/PoliciesListPage/PoliciesListPage.tsx
              src/pages/RolesPage/RolesListPage/RolesListPage.tsx
              src/pages/ServiceVersionPage/ServiceVersionPage.tsx
          - pr: 38309
            sha: 90e714708eef756fa209fa31f3ec75806de0f493
            sources: >-
              src/components/Dashboard/DataModel/DataModels/DataModelsTable.tsx
              src/pages/StoredProcedure/StoredProcedureTab.tsx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Check exact PR revision
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: openmetadata-ui/src/main/resources/ui/.nvmrc
      - name: Install pinned ANTLR
        run: sudo make install_antlr_cli
      - name: Install lockfile dependencies
        shell: bash
        run: |
          status=0
          corepack enable
          cd openmetadata-ui/src/main/resources/ui
          yarn install --frozen-lockfile --network-timeout 100000 > "$RUNNER_TEMP/ui-install.log" 2>&1 || status=$?
          tail -n 80 "$RUNNER_TEMP/ui-install.log"
          exit "$status"
      - name: Run tests related to the changed pagination components
        env:
          CHANGED_SOURCES: ${{ matrix.sources }}
        shell: bash
        run: |
          set -uo pipefail
          cd openmetadata-ui/src/main/resources/ui
          read -r -a sources <<< "$CHANGED_SOURCES"
          status=0
          yarn test --runInBand --watch=false --coverage=false --findRelatedTests "${sources[@]}" > "$RUNNER_TEMP/ui-tests.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/ui-tests.log"
          exit "$status"
