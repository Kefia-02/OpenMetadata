name: Isolated terminal ingestion status tests
on:
  push:
    branches:
      - verify/openmetadata-status-20261121
permissions:
  contents: read
jobs:
  test-terminal-status-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact status PR head
        uses: actions/checkout@v4
        with:
          ref: fix/37081-agent-completion-status-20261120
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact status branch
        run: test "$(git rev-parse HEAD)" = "04ea5d03b404b8d03d2f37550d0989f160a12648"
        shell: bash
      - name: Install official OpenMetadata test environment
        uses: ./.github/actions/setup-openmetadata-test-environment
        with:
          python-version: '3.10'
          classification-models: 'false'
          install-server: 'false'
          install-test-dependencies: 'true'
      - name: Run real regression tests from repository
        shell: bash
        run: |
          set -euo pipefail
          source env/bin/activate
          cd ingestion
          python -m pytest tests/unit/workflow/test_status_mixin_progress.py -q --tb=short
